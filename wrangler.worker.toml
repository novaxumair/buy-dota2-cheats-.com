# Cloudflare Worker + static assets (dist/). Custom domain: attach route buydota2cheats.com/*
# Local / CI: npm run build && npm run deploy:worker
# Dashboard (Workers Builds): Build command = npm run build | Deploy = npm run deploy:worker
# Do not also connect the same hostname to a Pages project (see docs/CLOUDFLARE-WORKER.md).
name = "buydota2cheats-worker"
compatibility_date = "2024-09-23"
main = "workers/site.js"

# Used when you run `wrangler deploy -c wrangler.worker.toml` without --no-build
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
