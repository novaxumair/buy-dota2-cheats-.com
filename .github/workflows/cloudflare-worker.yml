# Optional: use this ONLY if you deploy from GitHub (not Cloudflare Workers Builds).
# If Cloudflare dashboard already runs npm run build + npm run deploy:worker, leave this
# on workflow_dispatch or delete this file to avoid duplicate/failed runs.
name: Cloudflare Worker

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Require Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Add CLOUDFLARE_API_TOKEN in GitHub repo Settings → Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Add CLOUDFLARE_ACCOUNT_ID in GitHub repo Settings → Secrets."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
